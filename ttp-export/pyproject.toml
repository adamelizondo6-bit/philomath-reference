[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttp-export"
version = "0.1.0"
description = "Personal archival tool: save one's own TTP study record to Obsidian and Excel. Read-only, paced, real browser."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "beautifulsoup4>=4.12",
  "markdownify>=0.12",
  "openpyxl>=3.1",
  "rapidfuzz>=3.0",
  "pillow>=10",
  "pywin32>=306; sys_platform == 'win32'",
  "tomli>=2; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]
